# version: "3.9" # Docker Engine / Plugin と統合され、version を書く必要がなくなった

# ==========================================================
# docker-app-skeleton
# 「どんな PHP プロジェクトでも即動く開発環境」を作るための土台。
# - nginx + php-fpm（Laravel / Slim / PlainPHP 共通）
# - MySQL 9.7 / PostgreSQL 18（永続化は named volume）
# - Redis（セッション・KVS・ジョブキュー向け）
# DB は Compose profiles で切替: make up（両方）/ up-mysql / up-pg
# ==========================================================

services:

  # --------------------------------------------------------
  # Web サーバ（nginx）
  # --------------------------------------------------------
  nginx:
    # docker/nginx/Dockerfile を使用
    build: ./docker/nginx

    # "localhost:${WEB_PORT}" → "コンテナ内の 80 番" に接続
    # WEB_PORT は .env で必須（未設定ならエラー）
    ports:
      - "${WEB_PORT:?WEB_PORT is not set. Copy .env.sample to .env}:80"

    # src/ が Web ルート（/var/www/html）としてマウントされる
    # public/ がサーバルートになる（default.conf の指定）
    volumes:
      - ./src:/var/www/html

    # PHP が先に起動していてほしいので depends_on
    depends_on:
      - php

    networks:
      - appnet


  # --------------------------------------------------------
  # PHP 実行環境（php-fpm）
  # --------------------------------------------------------
  php:
    build: ./docker/php

    # アプリ本体を共有（Nginx と同じパス構造で動く）
    volumes:
      - ./src:/var/www/html

    # 有効なプロファイルの DB だけ healthy まで待つ（無い方は required: false でスキップ）
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false

    networks:
      - appnet


  # --------------------------------------------------------
  # MySQL 9.7（LTS）
  # --------------------------------------------------------
  mysql:
    image: mysql:9.7
    profiles: ["mysql"]

    # 初期設定（開発用途なので最低限）
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app

    volumes:
      # bind mount: ホストの storage/db。make down / make clean では消えない。WSL では権限・性能のトラブルが出ることがある。
      # - ./storage/db:/var/lib/mysql
      #
      # named volume: Docker 管理。make down では残る。make clean（--volumes）や make disintegrate、docker volume prune では消える。
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d

    # ※ 3306 を外に公開しておくと、TablePlus / Workbench などから接続できる
    # ports:
    #   - "3306:3306"   # ← デフォルトでは閉じておく

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - appnet


  # --------------------------------------------------------
  # PostgreSQL 18
  # --------------------------------------------------------
  postgres:
    image: postgres:18
    profiles: ["postgres"]

    # 公式イメージのスーパーユーザーは postgres。パスワードは MySQL root に合わせる。
    # 一般ユーザー app/app と DB app / app_testing は init.sql で作成する。
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root

    volumes:
      # 18+: マウント先は /var/lib/postgresql（/data ではない）
      # bind mount: ホストの storage/pg。make down / make clean では消えない。WSL では権限・性能のトラブルが出ることがある。
      # - ./storage/pg:/var/lib/postgresql
      #
      # named volume: Docker 管理。make down では残る。make clean（--volumes）や make disintegrate、docker volume prune では消える。
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

    # ※ 5432 を外に公開しておくと、TablePlus / DBeaver などから接続できる
    # ports:
    #   - "5432:5432"   # ← デフォルトでは閉じておく

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - appnet


  # --------------------------------------------------------
  # Redis（KVS / キャッシュ）
  # --------------------------------------------------------
  redis:
    image: redis:7

    # appendonly=no で軽量モード（開発向け）
    command: ["redis-server", "--appendonly", "no"]

    # 必要なら Redis をホストから叩けるようにする
    # （アプリからはコンテナ名 redis:6379 で届く。ホスト公開は MySQL/Postgres と同様デフォルト閉じ）
    # ports:
    #   - "6379:6379"

    networks:
      - appnet


# --------------------------------------------------------
# アプリケーション専用のネットワーク
# --------------------------------------------------------
networks:
  appnet:
    driver: bridge

volumes:
  mysql_data:
  postgres_data:
